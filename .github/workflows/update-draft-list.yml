name: Update Draft List

# When this runs:
# - every 15 minutes via cron (best-effort; GitHub may delay during high load)
# - whenever you push code changes to main
# - manually via the "Run workflow" button on the Actions page
on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

# One run at a time, cancel any in-progress run if a new one fires
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Oakley Greens draft list
        env:
          TOAST_CLIENT_ID: ${{ secrets.TOAST_CLIENT_ID }}
          TOAST_CLIENT_SECRET: ${{ secrets.TOAST_CLIENT_SECRET }}
          TOAST_RESTAURANT_GUID: ${{ secrets.OAKLEY_GREENS_GUID }}
          DRAFT_GROUP_NAME: "Draft Beer"
          BAR_NAME: "Oakley Greens"
        run: |
          mkdir -p site/oakley-greens
          python generate_draft_list.py --output-dir site/oakley-greens

      - name: Build landing index page
        run: |
          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Oakley Greens - On Tap</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, sans-serif;
                     max-width: 600px; margin: 4rem auto; padding: 0 1rem;
                     background: #fff; color: #503629; }
              h1 { font-family: Georgia, serif; }
              a { color: #C06B13; font-weight: 600; text-decoration: none; }
              a:hover { text-decoration: underline; }
              ul { padding-left: 1.2rem; line-height: 2; }
            </style>
          </head>
          <body>
            <h1>Oakley Greens - On Tap</h1>
            <ul>
              <li><a href="oakley-greens/draft_list.html">Oakley Greens - Live tap list</a></li>
            </ul>
            <p style="color:#888;font-size:.85em;margin-top:3rem">Pulled live from Toast POS. Refreshes every 15 minutes.</p>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
